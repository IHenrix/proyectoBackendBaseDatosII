# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - UTP-BDII-SPA

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: 'build/libs/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Select and rename jar
        run: |
          ls -R
          JAR=$(find . -name "*.jar" ! -name "*plain*" | head -n 1)
          echo "Using JAR: $JAR"
          mv "$JAR" app.jar

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F7200668EB9B4D178A6A86C3BF9ADB63 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ED646DF1AF8347318C0F2CB029201DFC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FB196714F70242A08F4BA57D700C424F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'UTP-BDII-SPA'
          slot-name: 'Production'
          package: 'app.jar'

      - name: Configure Spring Profile for Production
        run: |
          az webapp config appsettings set \
            --name UTP-BDII-SPA \
            --resource-group UTP-BDII-SPA_group \
            --settings SPRING_PROFILES_ACTIVE=prod
          